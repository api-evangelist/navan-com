aid: navan-com
name: Navan
description: >-
  Navan (formerly TripActions until its February 2023 rebrand) is a Palo Alto,
  California corporate travel and expense management platform that combines
  business travel booking, expense management, and corporate cards into a
  single product. Navan operates a global travel inventory with 24/7 agent
  support, a swipe-to-reconciliation expense flow with AI-assisted
  categorization and policy enforcement, and Navan Connect, a card-link
  network compatible with Visa, Mastercard, and American Express. Newer
  offerings include Navan Edge, a frequent-traveler assistant, and a Rewards
  program that incentivizes policy-compliant bookings. The company serves more
  than 10,000 organizations including Canva, DoorDash, and Duolingo. Navan
  exposes a partner-grade integration surface — a Booking Data API, an
  Expense API, a User Management REST API, a SCIM 2.0 provisioning endpoint,
  and an OAuth 2.0 client-credentials token endpoint — all under
  api.navan.com. Credentials and reference documentation are provisioned
  through the Admin portal (Settings → Integrations → API and Admin → SCIM
  settings) rather than a public developer portal, so the API contracts are
  not currently published as a downloadable OpenAPI specification.
